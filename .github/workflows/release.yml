name: release
# A version tag (v0.1.0-beta ...) builds the addon zip and makes the GitHub release.
# Pushing a tag needs the maintainer's go-ahead (docs/development.md). No CurseForge upload here.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # the GitHub release and its zip
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get install -y lua5.1
      - run: for f in ForeverDungeons/*.lua ForeverDungeons/Data/*.lua; do luac5.1 -p "$f"; done
      - run: python3 -P tools/test/lint.py
      - run: lua5.1 tools/test/harness.lua
      - run: python3 -P tools/package.py "$TAG"
      - name: GitHub release
        run: |
          pre=""; case "$TAG" in *-alpha*|*-beta*) pre="--prerelease";; esac
          gh release create "$TAG" $pre --title "Forever Dungeons $TAG" --generate-notes \
            "dist/ForeverDungeons-$TAG.zip"
